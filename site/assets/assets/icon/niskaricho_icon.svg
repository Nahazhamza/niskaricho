<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Niskaricho? app icon: an Islamic arch over a prayer rug, with a question mark formed by a crescent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14382F"/>
      <stop offset="1" stop-color="#0B1F1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CF7A"/>
      <stop offset="1" stop-color="#C08F32"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Squircle background (Android adaptive / iOS mask friendly) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Prayer rug (musalla) seen in perspective, with fringe -->
  <path d="M136 404 L376 404 L352 300 L160 300 Z" fill="url(#rug)"/>
  <path d="M152 392 L360 392 L342 312 L170 312 Z" fill="none" stroke="#F5EFE0" stroke-opacity=".55" stroke-width="5"/>
  <g stroke="#F5EFE0" stroke-opacity=".7" stroke-width="5" stroke-linecap="round">
    <path d="M150 404v16M180 404v16M210 404v16M240 404v16M272 404v16M302 404v16M332 404v16M362 404v16"/>
  </g>

  <!-- Pointed Islamic arch (mihrab) -->
  <path d="M146 312 V214 C146 160 196 118 256 84 C316 118 366 160 366 214 V312"
        fill="none" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Question mark: crescent hook + dot -->
  <path d="M212 200 A46 46 0 1 1 278 242 C262 252 256 262 256 280"
        fill="none" stroke="#F5EFE0" stroke-width="24" stroke-linecap="round"/>
  <!-- the dot doubles as a small star above the rug -->
  <path transform="translate(0 -8)" d="M256 296 l7 14 15 2 -11 10 3 15 -14 -7 -14 7 3 -15 -11 -10 15 -2 z" fill="url(#gold)"/>
</svg>
